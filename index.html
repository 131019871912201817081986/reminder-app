<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12332C">
<title>Remind Me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --pine: #12332C;
    --pine-soft: #29544A;
    --leaf: #2E9E6B;
    --mist: #EDF5F0;
    --paper: #FFFFFF;
    --sun: #F5C443;
    --ink: #1C2B27;
    --ink-soft: #5C6F69;
    --line: #D8E6DF;
    --radius-bubble: 22px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Nunito', system-ui, sans-serif;
    background: var(--mist);
    color: var(--ink);
    min-height: 100vh;
    min-height: 100dvh;
  }
  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: 0 18px calc(28px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
  }

  /* Header */
  header {
    padding: 26px 2px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 1.5rem;
    font-weight: 900;
    color: var(--pine);
    letter-spacing: -0.02em;
  }
  header h1 span { color: var(--leaf); }
  .gear {
    border: none;
    background: var(--paper);
    border: 1px solid var(--line);
    width: 40px; height: 40px;
    border-radius: 50%;
    font-size: 1.05rem;
    cursor: pointer;
    display: grid; place-items: center;
    color: var(--pine-soft);
  }
  .gear:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 3px solid var(--sun);
    outline-offset: 2px;
  }

  /* Composer — the signature chat bubble */
  .composer {
    background: var(--pine);
    border-radius: var(--radius-bubble);
    border-bottom-left-radius: 6px;
    padding: 18px;
    color: #fff;
    box-shadow: 0 10px 24px rgba(18, 51, 44, 0.18);
  }
  .composer label {
    display: block;
    font-weight: 700;
    font-size: 0.95rem;
    color: #BFDCCB;
    margin-bottom: 10px;
  }
  .composer textarea {
    width: 100%;
    border: none;
    resize: none;
    background: var(--pine-soft);
    color: #fff;
    border-radius: 14px;
    padding: 13px 14px;
    font: inherit;
    font-size: 1.05rem;
    font-weight: 600;
    min-height: 74px;
  }
  .composer textarea::placeholder { color: #9DBBAE; font-weight: 500; }
  .composer-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 12px;
  }
  .send {
    border: none;
    background: var(--sun);
    color: var(--pine);
    font: inherit;
    font-weight: 800;
    font-size: 1rem;
    padding: 11px 22px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.12s ease;
  }
  .send:active { transform: scale(0.96); }
  .send:disabled { opacity: 0.55; cursor: default; }

  /* Status toast */
  .toast {
    margin-top: 14px;
    border-radius: 14px;
    padding: 12px 14px;
    font-weight: 700;
    font-size: 0.95rem;
    display: none;
  }
  .toast.ok { display: block; background: #DDF2E4; color: #14522F; }
  .toast.err { display: block; background: #FBE3DE; color: #7C2D1C; }

  /* Upcoming list */
  .upcoming { margin-top: 26px; flex: 1; }
  .upcoming h2 {
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--pine);
    margin-bottom: 4px;
  }
  .upcoming p.sub {
    color: var(--ink-soft);
    font-size: 0.9rem;
    font-weight: 600;
    margin-bottom: 14px;
  }
  .item {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-bubble);
    border-top-right-radius: 6px;
    padding: 13px 16px;
    margin-bottom: 10px;
    display: flex;
    gap: 12px;
    align-items: baseline;
  }
  .item .when {
    flex-shrink: 0;
    font-weight: 800;
    font-size: 0.85rem;
    color: var(--leaf);
    min-width: 64px;
  }
  .item .when.today { color: #C77800; }
  .item .what { font-weight: 600; font-size: 0.98rem; }
  .empty {
    color: var(--ink-soft);
    font-weight: 600;
    background: none;
    border: 2px dashed var(--line);
    border-radius: var(--radius-bubble);
    padding: 22px 16px;
    text-align: center;
  }

  /* Setup panel */
  .setup {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-bubble);
    padding: 20px 18px;
    margin-top: 8px;
  }
  .setup h2 { font-size: 1.15rem; font-weight: 900; color: var(--pine); margin-bottom: 6px; }
  .setup p { color: var(--ink-soft); font-size: 0.92rem; font-weight: 600; margin-bottom: 16px; }
  .field { margin-bottom: 13px; }
  .field label {
    display: block;
    font-weight: 800;
    font-size: 0.88rem;
    color: var(--pine-soft);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 11px 12px;
    font: inherit;
    font-weight: 600;
    background: var(--mist);
  }
  .save {
    width: 100%;
    border: none;
    background: var(--pine);
    color: #fff;
    font: inherit;
    font-weight: 800;
    font-size: 1rem;
    padding: 13px;
    border-radius: 999px;
    cursor: pointer;
    margin-top: 4px;
  }
  .hidden { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    .send { transition: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Remind <span>me</span></h1>
    <button class="gear" id="gearBtn" aria-label="Settings">⚙</button>
  </header>

  <!-- First-run / settings -->
  <section class="setup hidden" id="setupPanel">
    <h2>Connect to your reminders</h2>
    <p>These details stay in this browser only. The token should be a fine-grained one that can open issues and read contents on your reminder repo — nothing else.</p>
    <div class="field">
      <label for="inUser">GitHub username</label>
      <input id="inUser" autocomplete="off" autocapitalize="none" placeholder="e.g. 13101987...">
    </div>
    <div class="field">
      <label for="inRepo">Reminder repo name</label>
      <input id="inRepo" autocomplete="off" autocapitalize="none" value="WhatsappReminder">
    </div>
    <div class="field">
      <label for="inToken">Fine-grained access token</label>
      <input id="inToken" type="password" autocomplete="off" placeholder="github_pat_...">
    </div>
    <button class="save" id="saveBtn">Save and connect</button>
  </section>

  <!-- Main app -->
  <main class="hidden" id="mainPanel">
    <section class="composer">
      <label for="reminderText">What should I remind you about?</label>
      <textarea id="reminderText" placeholder="e.g. dentist appointment on 5 July"></textarea>
      <div class="composer-row">
        <button class="send" id="sendBtn">Add reminder</button>
      </div>
    </section>
    <div class="toast" id="toast" role="status"></div>

    <section class="upcoming">
      <h2>Coming up</h2>
      <p class="sub">You'll get each one on WhatsApp the morning it's due.</p>
      <div id="list"><div class="empty">Loading your list…</div></div>
    </section>
  </main>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const store = {
    get: () => ({
      user: localStorage.getItem('rm_user') || '',
      repo: localStorage.getItem('rm_repo') || 'WhatsappReminder',
      token: localStorage.getItem('rm_token') || ''
    }),
    set: (user, repo, token) => {
      localStorage.setItem('rm_user', user);
      localStorage.setItem('rm_repo', repo);
      localStorage.setItem('rm_token', token);
    }
  };

  function showSetup() {
    const cfg = store.get();
    $('inUser').value = cfg.user;
    $('inRepo').value = cfg.repo;
    $('inToken').value = cfg.token;
    $('setupPanel').classList.remove('hidden');
    $('mainPanel').classList.add('hidden');
  }
  function showMain() {
    $('setupPanel').classList.add('hidden');
    $('mainPanel').classList.remove('hidden');
    loadUpcoming();
  }

  function toast(msg, kind) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast ' + kind;
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.className = 'toast'; }, 6000);
  }

  function api(path, opts = {}) {
    const cfg = store.get();
    return fetch('https://api.github.com/repos/' + cfg.user + '/' + cfg.repo + path, {
      ...opts,
      headers: {
        'Authorization': 'Bearer ' + cfg.token,
        'Accept': 'application/vnd.github+json',
        ...(opts.headers || {})
      }
    });
  }

  // --- Add a reminder (creates an issue; the repo's workflow does the rest) ---
  async function addReminder() {
    const text = $('reminderText').value.trim();
    if (!text) { toast('Type a reminder first.', 'err'); return; }
    $('sendBtn').disabled = true;
    try {
      const res = await api('/issues', {
        method: 'POST',
        body: JSON.stringify({ title: text })
      });
      if (!res.ok) throw new Error('GitHub said ' + res.status);
      $('reminderText').value = '';
      toast('Sent! Watch WhatsApp for your confirmation.', 'ok');
      setTimeout(loadUpcoming, 20000); // give the robot time to commit
    } catch (e) {
      toast("Couldn't add it — check your connection or token in ⚙. (" + e.message + ')', 'err');
    } finally {
      $('sendBtn').disabled = false;
    }
  }

  // --- Read reminders.txt and show what's coming ---
  async function loadUpcoming() {
    const list = $('list');
    try {
      const res = await api('/contents/reminders.txt', {
        headers: { 'Accept': 'application/vnd.github.raw+json' }
      });
      if (!res.ok) throw new Error(res.status);
      const lines = (await res.text()).split('\n');
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const dated = [], daily = [];
      for (const raw of lines) {
        const line = raw.trim();
        if (!line || line.startsWith('#')) continue;
        const m = line.match(/^(\d{4})-(\d{2})-(\d{2})\s+(.*)$/);
        if (m) {
          const d = new Date(+m[1], +m[2] - 1, +m[3]);
          if (d >= today) dated.push({ d, text: m[4] });
        } else {
          daily.push(line);
        }
      }
      dated.sort((a, b) => a.d - b.d);
      list.innerHTML = '';
      if (!dated.length && !daily.length) {
        list.innerHTML = '<div class="empty">Nothing scheduled yet — add your first reminder above.</div>';
        return;
      }
      const fmt = new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short' });
      for (const r of dated) {
        const isToday = r.d.getTime() === today.getTime();
        list.appendChild(item(isToday ? 'Today' : fmt.format(r.d), r.text, isToday));
      }
      for (const t of daily) list.appendChild(item('Daily', t, false));
    } catch (e) {
      list.innerHTML = '<div class="empty">Couldn\'t load your list — check your token in ⚙.</div>';
    }
  }

  function item(when, what, isToday) {
    const div = document.createElement('div');
    div.className = 'item';
    const w = document.createElement('span');
    w.className = 'when' + (isToday ? ' today' : '');
    w.textContent = when;
    const t = document.createElement('span');
    t.className = 'what';
    t.textContent = what;
    div.append(w, t);
    return div;
  }

  // --- Wire up ---
  $('sendBtn').addEventListener('click', addReminder);
  $('gearBtn').addEventListener('click', showSetup);
  $('saveBtn').addEventListener('click', () => {
    const u = $('inUser').value.trim(), r = $('inRepo').value.trim(), t = $('inToken').value.trim();
    if (!u || !r || !t) { alert('All three fields are needed.'); return; }
    store.set(u, r, t);
    showMain();
  });
  $('reminderText').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addReminder(); }
  });

  const cfg = store.get();
  (cfg.user && cfg.token) ? showMain() : showSetup();
</script>
</body>
</html>
